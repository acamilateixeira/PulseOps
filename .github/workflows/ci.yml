name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatação, lint, tipos e testes unitários
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Contratos primeiro (os outros pacotes importam o build)
        run: pnpm --filter @pulseops/contracts build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integração da API com PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
          POSTGRES_DB: pulseops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulseops" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://pulseops:pulseops@localhost:5432/pulseops
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulseops/contracts build
      - run: pnpm --filter @pulseops/api test:integration

  docker:
    name: Imagens Docker e smoke do Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Sobe o Compose completo (o mesmo que roda na máquina de quem baixa o repo)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke pelo nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/v1/services | grep -q '"slug":"checkout"'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/overview-deep-link | grep -q 200
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm audit --audit-level=high
